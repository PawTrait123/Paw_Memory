<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PawTrait Pet Profile</title>

<style>

:root {
  --bg:#f5f0eb;
  --card:#fefdfb;
  --text:#5a4a42;
  --muted:#8b7b73;
  --line:#e8dcd0;
  --gold:#d4a574;
}


*{
box-sizing:border-box;
}


body{

margin:0;
min-height:100vh;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

padding:14px;

font-family:
Georgia,
Garamond,
system-ui;

color:var(--text);

background:
linear-gradient(
180deg,
#f5f0eb,
#faf6f1
);

}



#logoBanner{

display:flex;
justify-content:center;

margin-bottom:20px;

width:100%;
max-width:380px;

}


#logoBanner img{

width:160px;

filter:
drop-shadow(
0 4px 8px
rgba(90,74,66,.1)
);

}



.card{

width:100%;
max-width:380px;

background:var(--card);

border:

2px solid var(--line);

border-radius:20px;

padding:24px;

box-shadow:

0 8px 32px
rgba(90,74,66,.08);

}



.header{

display:flex;

align-items:center;

gap:14px;

margin-bottom:18px;

}



.pet-photo{

width:80px;
height:80px;

border-radius:16px;

border:2px solid var(--gold);

object-fit:cover;

}



h1{

margin:0;

font-size:1.4rem;

color:#5a4a42;

}



.meta{

margin-top:6px;

color:var(--muted);

font-size:.9rem;

}



.status{

display:inline-block;

margin-top:8px;

padding:5px 12px;

border-radius:20px;

background:#f0ebe5;

font-size:.75rem;

}



.info{

padding:16px;

border:

1px solid var(--line);

border-radius:14px;

background:#faf6f1;

}



.info p{

margin:

0 0 10px;

font-size:.92rem;

}



.info strong{

color:var(--gold);

}



.info-row{

display:flex;

gap:12px;

}



.sound-btn{

width:56px;

border-radius:14px;

border:

2px solid var(--gold);

background:#faf6f1;

font-size:1.4rem;

color:var(--gold);

cursor:pointer;

}



.btn{

display:block;

width:100%;

padding:14px;

margin-top:10px;

border-radius:12px;

text-align:center;

text-decoration:none;

font-weight:600;

color:white;

background:

linear-gradient(
180deg,
#d4a574,
#c09356
);

}



.btn.wa{

background:

linear-gradient(
180deg,
#25d366,
#1da851
);

}



.video-overlay{

display:none;

position:fixed;

inset:0;

background:
rgba(90,74,66,.85);

align-items:center;

justify-content:center;

z-index:999;

}



.video-overlay.open{

display:flex;

}



.video-box{

width:90%;

max-width:420px;

background:black;

border-radius:16px;

overflow:hidden;

}



video{

width:100%;

}



.video-close{

position:absolute;

right:20px;

top:20px;

}



</style>

</head>


<body>


<div id="logoBanner">

<img src="https://raw.githubusercontent.com/PawTrait123/Paw_Memory/main/Pawstrait.png">

</div>



<main class="card">


<section class="header">


<img
class="pet-photo"
id="photo">


<div>

<h1 id="name"></h1>

<p class="meta" id="meta"></p>

<span class="status" id="status"></span>

</div>


</section>



<section class="info-row">


<div class="info">


<p id="allergy"></p>

<p id="notes"></p>

<p id="owner"></p>

<p id="vaccinated"></p>


</div>



<button
class="sound-btn"
onclick="playSound()">

♪

</button>


</section>



<a
class="btn wa"
id="whatsapp">

💬 WhatsApp Owner

</a>



<a
class="btn"
id="call">

📞 Call Owner

</a>



<button
class="btn"
onclick="openVideo()">

🎬 Watch Video

</button>



</main>



<audio id="sound"></audio>



<div
class="video-overlay"
id="videoOverlay">


<div class="video-box">


<button
class="video-close"
onclick="closeVideo()">

✕

</button>


<video
id="video"
controls
playsinline>

</video>


</div>


</div>





<script>


let pet={};



fetch("data.json")

.then(res=>res.json())

.then(data=>{


pet=data;



document.getElementById("photo").src=pet.photo;



document.getElementById("name").innerHTML=
pet.name;



document.getElementById("meta").innerHTML=
`
${pet.species} · ${pet.gender}
<br>
Born: ${pet.born}
<br>
NFC: ${pet.nfcId}
`;



document.getElementById("status").innerHTML=

pet.vaccinated

?
"Vaccinated"

:
"Not Vaccinated";



document.getElementById("allergy").innerHTML=

`
<strong>Allergy:</strong>
${pet.allergy}
`;



document.getElementById("notes").innerHTML=

`
<strong>Notes:</strong>
${pet.notes}
`;



document.getElementById("owner").innerHTML=

`
<strong>Owner:</strong>
${pet.owner}
`;



document.getElementById("vaccinated").innerHTML=

`
<strong>Status:</strong>
${pet.vaccinated?"Healthy":"Need Attention"}
`;



document.getElementById("sound").src=
pet.sound;



document.getElementById("video").src=
pet.video;



document.getElementById("whatsapp").href=

"https://wa.me/"+pet.phone;



document.getElementById("call").href=

"tel:"+pet.phone;



});





function playSound(){

document
.getElementById("sound")
.play();

}



function openVideo(){

document
.getElementById("videoOverlay")
.classList
.add("open");


document
.getElementById("video")
.play();

}



function closeVideo(){

document
.getElementById("videoOverlay")
.classList
.remove("open");


document
.getElementById("video")
.pause();

}



</script>


</body>

</html>
