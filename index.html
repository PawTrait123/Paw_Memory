<script>


let pet = {};


// 获取 NFC ID

function getPetFile(){

    const params = new URLSearchParams(
        window.location.search
    );

    let id = params.get("id");


    if(!id){

        id = "A001";

    }


    return id + ".json";

}




fetch(getPetFile())

.then(res=>res.json())

.then(data=>{


pet=data;



document.getElementById("photo").src =
pet.photo;



document.getElementById("name").innerHTML =
pet.name;



document.getElementById("meta").innerHTML =
`
${pet.species} · ${pet.gender}
<br>
Born: ${pet.born}
<br>
NFC: ${pet.nfcId}
`;



document.getElementById("status").innerHTML =

pet.vaccinated

?
"Vaccinated"

:
"Not Vaccinated";



document.getElementById("allergy").innerHTML =

`
<strong>Allergy:</strong>
${pet.allergy}
`;



document.getElementById("notes").innerHTML =

`
<strong>Notes:</strong>
${pet.notes}
`;



document.getElementById("owner").innerHTML =

`
<strong>Owner:</strong>
${pet.owner}
`;



document.getElementById("vaccinated").innerHTML =

`
<strong>Status:</strong>
${pet.vaccinated
?"Healthy"
:"Need Attention"}
`;



document.getElementById("sound").src =
pet.sound;



document.getElementById("video").src =
pet.video;



document.getElementById("whatsapp").href =

"https://wa.me/" + pet.phone;



document.getElementById("call").href =

"tel:" + pet.phone;



})

.catch(error=>{


document.querySelector(".card").innerHTML=

`
<h2>
Pet profile not found
</h2>

<p>
Please check NFC ID
</p>
`;


});





function playSound(){

document
.getElementById("sound")
.play();

}




function openVideo(){

document
.getElementById("videoOverlay")
.classList
.add("open");


document
.getElementById("video")
.play();

}




function closeVideo(){

document
.getElementById("videoOverlay")
.classList
.remove("open");


document
.getElementById("video")
.pause();

}



</script>
